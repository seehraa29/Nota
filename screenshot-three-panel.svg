  <rect x="392" y="121" width="508" height="1" fill="#2d3040"/>
  <!-- Note content -->
  <text x="432" y="148" fill="#e8ecf8" font-size="16" font-weight="700">React Hooks guide</text>
  <text x="432" y="170" fill="#9ca8c0" font-size="12">Hooks let you use state and lifecycle features in function</text>
  <text x="432" y="186" fill="#9ca8c0" font-size="12">components. Introduced in React 16.8.</text>
  <text x="432" y="216" fill="#e8ecf8" font-size="13" font-weight="700">Common hooks</text>
  <!-- Code block -->
  <rect x="432" y="226" width="420" height="64" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="444" y="244" fill="#79c0ff" font-size="11" font-family="monospace">const [count, setCount] = useState(0);</text>
  <text x="444" y="260" fill="#79c0ff" font-size="11" font-family="monospace">useEffect(() => {</text>
  <text x="444" y="276" fill="#79c0ff" font-size="11" font-family="monospace">  document.title = `Count: ${"{count}"}` ;</text>
  <text x="444" y="284" fill="#4e5570" font-size="10" font-family="monospace">}, [count]);</text>
</svg>