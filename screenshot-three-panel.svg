  <text x="501" y="113" text-anchor="middle" fill="#9ca8c0" font-size="9">H1</text>
  <rect x="518" y="101" width="26" height="16" rx="3" fill="rgba(255,255,255,0.04)" stroke="#2d3040" stroke-width="1"/>
